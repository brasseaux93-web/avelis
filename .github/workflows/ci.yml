name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compliance-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: avelis_admin
          POSTGRES_PASSWORD: avelis_password
          POSTGRES_DB: avelis_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          
      - name: Install dependencies
        run: npm ci || npm install
        
      - name: Run linting (compliance checks)
        run: npm run lint
        
      - name: Run speech-safety tests
        run: npm run test:speech-safety
        
      - name: Run ledger tests
        run: npm run test:ledger
        
      - name: Run retention tests
        run: npm run test:retention

      - name: Run room + security tests
        run: npx vitest run tests/room tests/security
